name: Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build md2mdoc
      run: make
    
    - name: Run syntax tests
      run: chmod u+x ./runtest.sh && ./runtest.sh
